# Publie le dossier du site sur GitHub Pages, en doublure de Netlify.
# Le dossier publié est le même que celui de netlify.toml : aos-ain-chock/
name: Publier sur GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne interrompt pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Constituer l'archive du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: aos-ain-chock

      - name: Publier
        id: publication
        uses: actions/deploy-pages@v4
